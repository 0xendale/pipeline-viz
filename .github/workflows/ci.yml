# Every claim this crate makes on crates.io is checked here.
#
# "Works with the feature off", "needs no Node.js once published", "builds on
# 1.75", "0.1.1 is a compatible upgrade" — each of those is a job below. A claim
# nothing verifies is a claim that quietly stops being true.
#
# Actions are pinned to full commit SHAs. A moving tag is a moving supply chain.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes anywhere. No publish, no release, no token use.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The full gate on the toolchain most people build with.
  rust-stable:
    name: Rust (stable, viz on)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, 2026-08-05
        with:
          toolchain: stable
          components: rustfmt, clippy
      # build.rs builds the dashboard from templates/ in a git checkout, so a
      # viz build needs the Node toolchain. A published crate does not; the
      # package-smoke job is what proves that.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: cargo fmt --all --check
      - run: cargo clippy --features viz,macros --all-targets -- -D warnings
      - run: cargo test --features viz,macros

  # The default build. Deliberately given no Node.js and no npm ci: with viz
  # off there is nothing to build a dashboard from, and this job failing would
  # mean the off-by-default path had grown a toolchain requirement.
  rust-viz-off:
    name: Rust (viz off)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, 2026-08-05
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --no-default-features --features macros --all-targets -- -D warnings
      - run: cargo test --no-default-features --features macros

  # rust-version in Cargo.toml is a promise. This is the only thing keeping it.
  msrv:
    name: MSRV 1.75
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, 2026-08-05
        with:
          toolchain: stable
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, 2026-08-05
        with:
          toolchain: 1.75.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      # Cargo.lock is gitignored, so the MSRV run resolves its own. Cargo 1.75
      # predates MSRV-aware resolution and would take the newest of everything;
      # stable cargo with the fallback resolver picks versions this crate's
      # rust-version can actually compile, and writes a v3 lock 1.75 can read.
      - name: Resolve dependencies compatible with 1.75
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
        run: cargo +stable generate-lockfile
      # rust-embed-impl 8.12.0 declares no rust-version, so the resolver cannot
      # see that it drags in sha2 0.11 -> block-buffer 0.12, which is edition
      # 2024 and unparseable by cargo 1.75. Pin the last version that is not.
      - name: Pin rust-embed-impl below its edition-2024 dependency
        run: cargo +stable update -p rust-embed-impl --precise 8.11.0
      - run: cargo +1.75.0 check --no-default-features --lib
      - run: cargo +1.75.0 check --no-default-features --features macros --all-targets
      - run: cargo +1.75.0 check --features viz,macros --all-targets

  # The wire protocol has two implementations. Both are tested.
  frontend:
    name: Protocol and dashboards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run protocol:test
      - run: npm run protocol:typecheck
      - run: npm run simple:test
      - run: npm run simple:typecheck
      - run: npm run simple:lint
      - run: npm run simple:build
      - run: npm run three-d:test
      - run: npm run three-d:typecheck
      - run: npm run three-d:lint
      - run: npm run three-d:build

  # Public items are documented, and both feature surfaces render cleanly.
  rustdoc:
    name: Rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, 2026-08-05
        with:
          toolchain: stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: cargo doc --features viz,macros --no-deps
      - run: cargo doc --no-default-features --features macros --no-deps

  # The drop-in claim, on both platforms a user is likely to be on. The script
  # rejects a damaged archive, builds default/viz/viz+macros consumers against
  # the unpacked crate with npm, node and npx replaced by failing markers, and
  # runs the viz consumer to read a named held item back out of its snapshot.
  package-smoke:
    name: Package smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master, 2026-08-05
        with:
          toolchain: stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: bash scripts/verify-package.sh --build

  # A patch release must not change the public API. Both root feature surfaces
  # are checked; the macro crate is not named, because it is released separately.
  semver:
    name: SemVer (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: viz on
            features: viz,macros
          - label: viz off
            features: macros
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          package: pipeline-viz
          feature-group: only-explicit-features
          features: ${{ matrix.features }}

  # This file is itself a thing that can be wrong.
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        # actionlint 1.7.12 needs a newer Go than some runner images ship.
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Run actionlint
        run: "$(go env GOPATH)/bin/actionlint"
