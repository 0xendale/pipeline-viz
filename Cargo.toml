[package]
name = "pipeline-viz"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Live item-level visibility for Rust data pipelines: see where every work item is and why it is stuck."
license = "MIT"
readme = "README.md"
repository = "https://github.com/0xendale/pipeline-viz"
documentation = "https://docs.rs/pipeline-viz"
keywords = ["pipeline", "observability", "telemetry", "visualization", "etl"]
categories = ["development-tools::debugging", "visualization"]
build = "build.rs"

# `assets/` is gitignored — it is produced by `build.rs` from templates/three-d.
# Naming it here overrides the gitignore for packaging, so the published crate
# carries prebuilt dashboard assets and users never need Node.js installed.
# The `templates/` and `packages/` trees are deliberately absent: they are the
# development sources for those assets, not something a consumer compiles.
#
# Every pattern is anchored with a leading slash. These are gitignore-style
# globs, so a bare `README.md` would match one in every node_modules package.
include = [
    "/src/**/*.rs",
    "/build.rs",
    "/assets/**",
    "/examples/**/*.rs",
    "/tests/**/*.rs",
    "/README.md",
    "/LICENSE",
]

[workspace]
members = ["macros"]

[dependencies]
pipeline-viz-macros = { version = "0.1.0", path = "macros", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["sync", "rt", "time", "macros", "net"], optional = true }
axum = { version = "0.8", default-features = false, features = ["ws", "http1", "tokio"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink"], optional = true }
sysinfo = { version = "0.33", default-features = false, features = ["system"], optional = true }
# `debug-embed` matters: without it rust-embed reads assets off disk in debug
# builds, which works in this repository and nowhere else.
rust-embed = { version = "8", default-features = false, features = ["debug-embed"], optional = true }
mime_guess = { version = "2", default-features = false, optional = true }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"

[features]
default = []
viz = [
    "dep:serde",
    "dep:serde_json",
    "dep:tokio",
    "dep:axum",
    "dep:futures-util",
    "dep:sysinfo",
    "dep:rust-embed",
    "dep:mime_guess",
]
# Attribute-macro sugar over the runtime API. Useful with `viz` off too: the
# expansion is the same runtime calls, which compile to nothing in that build.
macros = ["dep:pipeline-viz-macros"]

[[example]]
name = "fake_indexer"
required-features = ["viz"]

[package.metadata.docs.rs]
features = ["viz", "macros"]
